name: test
on: [ push, pull_request ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   target: linux,   platform: linux-x64,   rust-target: x86_64-unknown-linux-gnu }
          - { os: macos-14,       target: darwin,  platform: darwin-arm64, rust-target: aarch64-apple-darwin }
          - { os: windows-latest, target: windows, platform: win32-x64,   rust-target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actboy168/setup-luamake@master

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build
        run: luamake -platform ${{ matrix.platform }}
